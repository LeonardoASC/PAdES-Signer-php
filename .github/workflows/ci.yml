name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.4'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, openssl, zlib
          coverage: none

      - name: Validate Composer metadata
        run: |
          composer validate --strict --no-check-lock
          composer validate packages/laravel/composer.json --strict

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: PHP syntax check
        shell: bash
        run: |
          find src tests packages/laravel/src packages/laravel/config -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: Run CI-safe PHPUnit suite
        run: vendor/bin/phpunit -c phpunit.ci.xml --display-skipped --display-warnings

  laravel-package:
    name: Laravel package metadata
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, openssl, zlib
          coverage: none

      - name: Validate optional Laravel package
        run: composer validate packages/laravel/composer.json --strict
